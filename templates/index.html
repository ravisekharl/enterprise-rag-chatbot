<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <title>Enterprise RAG Chatbot</title>
 
    <link rel="stylesheet" href="/static/style.css">
</head>
 
<body>
 
    <div class="container">
 
        <h1>Enterprise RAG Chatbot</h1>
 
        <hr>
 
        <h2>Upload Document</h2>
 
        <form action="/upload" method="post" enctype="multipart/form-data">
 
            <input type="file" name="file" required>
 
            <button type="submit">
                Upload
            </button>
 
        </form>
 
        {% if message %}
            <p class="success">
                {{ message }}
            </p>
        {% endif %}
 
        {% if collection_name %}
            <p>
                <strong>Current Document:</strong>
                {{ collection_name }}
            </p>
        {% endif %}
 
        <hr>
 
        <h2>Ask Question</h2>
 
        <form action="/chat" method="post">
 
            <!-- Hidden field -->
            <input
                type="hidden"
                name="collection_name"
                value="{{ collection_name }}"
            >
 
            <textarea
                name="question"
                rows="6"
                cols="80"
                placeholder="Ask your question..."
                required
            ></textarea>
 
            <br><br>
 
            <button type="submit">
                Ask
            </button>
 
        </form>
 
        {% if answer %}
 
        <hr>
 
        <h2>Answer</h2>
 
        <div class="answer">
            {{ answer }}
        </div>
 
        {% endif %}
 
    </div>
 
</body>
 
</html>
